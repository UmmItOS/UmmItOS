# UmmItOS: the shell's panel, text and default accent; no borders, as in the shell.
[Metadata]
Name=UmmItOS
Version=1
Author=UmmItOS
Description=Matches the UmmItOS shell
ScaleWithDPI=True

[InputPanel]
NormalColor=#e8e8f0
HighlightCandidateColor=#ffffff
HighlightColor=#ffffff
HighlightBackgroundColor=#5003c0
Spacing=4

[InputPanel/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

# Rounded corners need an image, stretched from its middle; the corners are clear, so Hyprland blurs only the panel.
[InputPanel/Background]
Image=panel.png

[InputPanel/Background/Margin]
Left=16
Right=16
Top=16
Bottom=16

[InputPanel/ContentMargin]
Left=8
Right=8
Top=8
Bottom=8

[InputPanel/Highlight]
Image=highlight.png

[InputPanel/Highlight/Margin]
Left=10
Right=10
Top=6
Bottom=6

[Menu]
NormalColor=#e8e8f0
HighlightCandidateColor=#ffffff
Spacing=2

[Menu/Background]
Image=panel.png

[Menu/Background/Margin]
Left=16
Right=16
Top=16
Bottom=16

[Menu/Highlight]
Image=highlight.png

[Menu/Highlight/Margin]
Left=10
Right=10
Top=6
Bottom=6

[Menu/Separator]
Color=#ffffff1f

[Menu/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4
