general {
    lock_cmd = qs -c ummitos ipc call lock lock
    # Hold sleep until the session lock is up (the default waits only for hyprlock), for at most logind's InhibitDelayMaxSec, 5 s by default.
    inhibit_sleep = 3
    # Black before sleep, so waking can fade up out of it (Wake in the shell).
    before_sleep_cmd = qs -c ummitos ipc call wake hold; loginctl lock-session
    # The first form is the hyprlang config's, the second the Lua config's;
    # whichever is running accepts one and ignores the other.
    after_sleep_cmd = hyprctl dispatch dpms on; hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; qs -c ummitos ipc call wake play
}

listener {
    timeout = 1800
    on-timeout = bash ~/script/hypr/lock/detect_vm.sh
}
