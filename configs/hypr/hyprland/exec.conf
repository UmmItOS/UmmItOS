# Startup applications
# The quickshell config in configs/quickshell covers the bar, notifications
# and wallpaper. Re-enable these three to go back to waybar/swaync/awww.
exec-once = qs -c ummitos
#exec-once = waybar --log-level debug
#exec-once = awww-daemon
#exec-once = swaync & swaync-client -swb -t
exec-once = wl-paste --watch $HOME/script/cliphist/clip-store.sh
exec-once = hypridle
exec-once = fcitx5
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = $HOME/script/misc/first-run.sh
