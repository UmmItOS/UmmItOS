# Startup applications
# The quickshell config in configs/quickshell is the bar, notifications,
# wallpaper, launcher, session menu and OSD.
exec-once = qs -c ummitos
exec-once = wl-paste --watch $HOME/script/cliphist/clip-store.sh
exec-once = hypridle
exec-once = fcitx5
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = $HOME/script/misc/first-run.sh
