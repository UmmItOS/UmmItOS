# This file only contains the keybindings for 3rd party applications

$key = TAB
$modifier = ALT
$modifier_release = ALT_L
$reverse = SHIFT

# Define the applications to be used
$terminal = kitty
$fileManager = kitty -e yazi /home/$USER

# Define the scripts to be used
$application_launcher = qs -c ummitos ipc call launcher apps
$clipboard_manager = qs -c ummitos ipc call launcher clipboard
$wallpaper_picker = qs -c ummitos ipc call wallpaper toggle
$color_picker = bash ~/script/hypr/hyprpicker/hyprpicker.sh
$lock_screen = hyprlock

# binding the programs to the keys
bindd = $mainMod, T, Launch terminal (kitty), exec, $terminal
bindd = $mainMod, E, Launch file manager (yazi), exec, $fileManager
bindd = $mainMod, 36, Application launcher, exec, $application_launcher
bindd = $mainMod, X, Session menu, exec, qs -c ummitos ipc call session toggle
bindd = $mainMod, slash, Keybind cheat sheet, exec, qs -c ummitos ipc call cheatsheet toggle
bindd = $mainMod, L, Lock screen, exec, $lock_screen
bindd = ALT_L, V, Clipboard manager, exec, $clipboard_manager
bindd = ALT_L, W, Wallpaper picker, exec, $wallpaper_picker
bindd = ALT_L, E, Emoji picker (Smile), exec, smile
bindd = ALT_L, P, Color picker (Hyprpicker), exec, $color_picker
bindd = ALT_L, O, Screen magnifier (woomer), exec, woomer
bindd = $mainMod Shift, R, Start/stop screen recording, exec, bash ~/script/misc/wf-recorder.sh
bindd = $mainMod Shift, 36 , Upgrade UmmItOS, exec, kitty -e  ~/script/misc/update.sh

# HyprShot <- https://github.com/Gustash/Hyprshot
bindd = $mainMod, PRINT, Screenshot active window, exec, qs -c ummitos ipc call screenshot window
bindd = , PRINT, Screenshot full screen, exec, qs -c ummitos ipc call screenshot screen
bindd = SHIFT, PRINT, Screenshot region, exec, qs -c ummitos ipc call screenshot toggle
# The same shots without Print, which laptops often put behind Fn.
bindd = $mainMod Shift, W, Screenshot a window, exec, qs -c ummitos ipc call screenshot window

# Alt+Tab reaches the shell through the global-shortcuts protocol rather than
# a keybind, so the switcher can see Alt released and commit on its own.
bindd = ALT, TAB, Window switcher (next), global, quickshell:switcherNext
bindd = ALT SHIFT, TAB, Window switcher (previous), global, quickshell:switcherPrev
# Release Alt to commit, the way a real switcher behaves.
bindrtd = ALT, Alt_L, Release Alt to pick the switcher window, global, quickshell:switcherCommit
