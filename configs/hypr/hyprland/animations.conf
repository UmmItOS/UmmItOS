animations {
    enabled = true

    # Arrives fast and settles with a small overshoot, like a card set down.
    bezier = land, 0.05, 0.9, 0.1, 1.05
    # Decelerates to a stop with no bounce: moves, resizes, workspaces.
    bezier = glide, 0.05, 0.7, 0.1, 1
    # Leaves by accelerating away; an exit should not linger.
    bezier = leave, 0.3, 0, 0.8, 0.15
    bezier = liner, 1, 1, 1, 1

    animation = windowsIn, 1, 4.5, land, popin 85%
    animation = windowsOut, 1, 2.5, leave, popin 90%
    animation = windowsMove, 1, 4, glide, slide

    animation = fadeIn, 1, 3, glide
    animation = fadeOut, 1, 2, leave
    animation = fadeSwitch, 1, 4, glide
    animation = fadeDim, 1, 4, glide

    # The shell's own layers (ummitos-*) are no_anim and animate themselves;
    # this is for everyone else's.
    animation = layersIn, 1, 3, land, popin 90%
    animation = layersOut, 1, 2, leave, popin 95%
    animation = fadeLayers, 1, 2, glide

    animation = workspaces, 1, 5, glide, slidefade 15%
    animation = specialWorkspace, 1, 4, land, slidefadevert 20%

    animation = border, 1, 1, liner
    animation = borderangle, 1, 50, liner, loop
}
