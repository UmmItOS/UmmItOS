animations {
    enabled = true

    # Arrives fast, overshoots clearly, then settles.
    bezier = land, 0.05, 0.9, 0.1, 1.15
    # Decelerates to a stop with no bounce, for fades.
    bezier = glide, 0.05, 0.7, 0.1, 1
    # Leaves with a small pull back first, then away.
    bezier = leave, 0.36, 0, 0.66, -0.3
    bezier = liner, 1, 1, 1, 1

    animation = windowsIn, 1, 7, land, popin 60%
    animation = windowsOut, 1, 5, leave, popin 70%
    animation = windowsMove, 1, 6, land, slide

    animation = fadeIn, 1, 6, glide
    animation = fadeOut, 1, 5, glide
    animation = fadeSwitch, 1, 6, glide
    animation = fadeDim, 1, 6, glide

    # The shell's own layers (ummitos-*) are no_anim and animate themselves;
    # this is for everyone else's.
    animation = layersIn, 1, 5, land, popin 75%
    animation = layersOut, 1, 4, leave, popin 80%
    animation = fadeLayers, 1, 4, glide

    animation = workspaces, 1, 7, land, slidefade 30%
    animation = specialWorkspace, 1, 6, land, slidefadevert 40%

    animation = border, 1, 1, liner
    animation = borderangle, 1, 50, liner, loop
}
